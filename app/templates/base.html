<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">⚖️ {{ app_name }}</a>
        <nav>
            {% if user %}
                <a href="/dashboard">Dashboard</a>
                <a href="/analyze">New analysis</a>
                <span class="who">{{ user.full_name or user.email }}</span>
                <a class="btn-link" href="/logout">Sign out</a>
            {% else %}
                <a href="/login">Sign in</a>
                <a href="/register">Register</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        Local-only Legal Analyst &middot; front end for your local AI system
    </footer>
</body>
</html>
