{% extends "base.html" %}
{% block title %}New analysis &middot; {{ app_name }}{% endblock %}
{% block content %}
<div class="card">
    <h1>New legal analysis</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/analyze">
        <label>Title
            <input type="text" name="title" placeholder="e.g. NDA - Acme Corp">
        </label>
        <label>Analysis type
            <select name="analysis_type">
                {% for key, label in analysis_types.items() %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Document text
            <textarea name="source_text" rows="12" required
                placeholder="Paste the contract, filing, or clause text here..."></textarea>
        </label>
        <button type="submit" class="btn">Analyze</button>
    </form>
</div>
{% endblock %}
